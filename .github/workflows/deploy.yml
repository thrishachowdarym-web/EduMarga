name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Find output directory and prepare artifact
        run: |
          if [ -d "dist" ]; then
            echo "DEPLOY_DIR=dist" >> $GITHUB_ENV
          elif [ -d ".output/public" ]; then
            echo "DEPLOY_DIR=.output/public" >> $GITHUB_ENV
          elif [ -d "build" ]; then
            echo "DEPLOY_DIR=build" >> $GITHUB_ENV
          else
            echo "Directory list after build:"
            ls -la
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.DEPLOY_DIR }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
